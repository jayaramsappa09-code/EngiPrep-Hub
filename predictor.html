<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Predictor Hub | EngiPrepHub</title>
    <link rel="stylesheet" href="/src/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 dark:bg-[#030306] text-slate-800 dark:text-gray-300 antialiased">
    <header class="fixed top-0 w-full z-50 backdrop-blur-xl bg-white/80 dark:bg-[#030306]/85 border-b border-slate-200 dark:border-slate-800">
        <nav class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/30">
                    <span class="font-black text-xl text-white">E</span>
                </div>
                <span class="text-xl font-black tracking-tighter uppercase text-slate-900 dark:text-slate-50">EngiPrep <span class="text-blue-600 italic">Hub</span></span>
            </a>
            <div class="flex items-center gap-4">
                <a href="/dashboard.html" class="px-4 py-2 text-slate-600 hover:text-blue-600 font-bold text-sm">Dashboard</a>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 pt-32 pb-24">
        <h1 class="text-4xl font-black mb-12">Academic Predictor Center</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- SGPA Predictor -->
            <div class="bg-white dark:bg-slate-900 p-8 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-sm">
                <h2 class="text-2xl font-black mb-6">SGPA Predictor</h2>
                <div class="space-y-4">
                    <input type="text" id="subject-name" placeholder="Subject Name" class="w-full p-4 rounded-xl border dark:bg-slate-800">
                    <input type="number" id="subject-marks" placeholder="Marks" class="w-full p-4 rounded-xl border dark:bg-slate-800">
                    <button onclick="calculateSGPA()" class="w-full py-3 bg-blue-600 text-white rounded-xl font-black uppercase text-xs tracking-widest">Add Subject & Predict</button>
                    <div id="sgpa-result" class="text-center font-black text-2xl mt-4 text-blue-600"></div>
                </div>
            </div>

            <!-- Attendance Predictor -->
            <div class="bg-white dark:bg-slate-900 p-8 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-sm">
                <h2 class="text-2xl font-black mb-6">Attendance Predictor</h2>
                 <div class="space-y-4">
                    <input type="number" id="total-classes" placeholder="Classes Conducted" class="w-full p-4 rounded-xl border dark:bg-slate-800">
                    <input type="number" id="attended-classes" placeholder="Classes Attended" class="w-full p-4 rounded-xl border dark:bg-slate-800">
                    <button onclick="calculateAttendance()" class="w-full py-3 bg-emerald-600 text-white rounded-xl font-black uppercase text-xs tracking-widest">Calculate Trend</button>
                    <div id="attendance-result" class="text-center font-bold mt-4"></div>
                </div>
            </div>
            
            <!-- 9.0 GPA Simulator -->
            <div class="bg-white dark:bg-slate-900 p-8 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-sm">
                <h2 class="text-2xl font-black mb-6">9.0 GPA Simulator</h2>
                <p class="text-sm mb-4 text-slate-500">Enter your current CGPA and semesters remaining to see what you need for a 9.0.</p>
                <input type="number" id="current-cgpa" placeholder="Current CGPA" class="w-full p-4 rounded-xl border dark:bg-slate-800 mb-2">
                <button onclick="simulate9GPA()" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-black uppercase text-xs tracking-widest">Simulate Strategy</button>
                <div id="simulator-result" class="text-center mt-4 text-sm font-bold"></div>
            </div>
        </div>
    </main>

    <script>
        function calculateSGPA() {
            const marks = document.getElementById('sgpa-input').value;
            const sgpa = (marks / 10).toFixed(2); // Mock logic
            document.getElementById('sgpa-result').textContent = `Predicted SGPA: ${sgpa}`;
        }
    </script>
</body>
</html>
